const steps=[['Інструктаж',5],['Умови поставки',10],['Аудит за ролями',15],['Нарада',10],['Виправлення',15],['Кризова ситуація',10],['Рішення',10],['Підсумки',5]];
const roles=[['Менеджер ЗЕД','Перевірте Commercial Invoice: сторони, товар, кількість, ціну, загальну вартість, валюту та Incoterms.'],['Логіст','Перевірте CMR: відправник, одержувач, місце доставки, вантажні місця та масу.'],['Фахівець із пакування','Перевірте Packing List: кількість коробок, вміст, нетто, брутто та відповідність інвойсу.'],['Митний брокер','Зіставте документи для митного оформлення: кількість, масу, вартість, опис товару та походження.'],['Представник покупця','Перевірте відповідність замовленню: 500 стільців, 100 коробок, 20 000 EUR, доставка до Варшави.'],['Керівник відділу ЗЕД','Зберіть висновки, визначте критичні розбіжності, розподіліть завдання та ухваліть рішення.']];
const initial=()=>({stage:0,role:0,doc:0,roles:roles.map(()=>({student:'',findings:'',risks:'',actions:'',status:'pending'})),meeting:'',fixes:[{doc:'Commercial Invoice',field:'Total Value',before:'22 000 EUR',after:'',owner:''},{doc:'Packing List',field:'Number of Packages',before:'90 cartons',after:'',owner:''},{doc:'Packing List',field:'Gross Weight',before:'2 400 kg',after:'',owner:''},{doc:'CMR',field:'Place of Delivery',before:'Krakow, Poland',after:'',owner:''}],extra:'',incident:'',decision:'pending',decisionWhy:'',tasks:'',reflection:'',checked:{},revealFixes:false,teacher:false,seconds:4800});
let state;try{state=Object.assign(initial(),JSON.parse(localStorage.getItem('zedGame80')||'{}'))}catch(e){state=initial()}let ticking=null;
function save(){try{localStorage.setItem('zedGame80',JSON.stringify(state))}catch(e){}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(path,val){let p=path.split('.'),obj=state;for(let i=0;i<p.length-1;i++)obj=obj[p[i]];obj[p[p.length-1]]=val;save()}
function bind(){document.querySelectorAll('[data-path]').forEach(el=>{el.addEventListener('input',()=>field(el.dataset.path,el.value));el.addEventListener('change',()=>field(el.dataset.path,el.value))})}
function input(path,val,placeholder='',rows=3){return `<textarea data-path="${path}" rows="${rows}" placeholder="${esc(placeholder)}">${esc(val)}</textarea>`}
function select(path,val,options){return `<select data-path="${path}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`).join('')}</select>`}
function render(){document.body.classList.toggle('teacher',state.teacher);document.getElementById('nav').innerHTML=steps.map(([n,m],i)=>`<button class="nav ${i===state.stage?'active':''}" onclick="go(${i})"><span>${i+1}. ${n}</span><small>${m} хв</small></button>`).join('');document.getElementById('progress').style.width=((state.stage+1)/8*100)+'%';document.getElementById('progressText').textContent=`Етап ${state.stage+1} з 8`;document.getElementById('prev').disabled=state.stage===0;document.getElementById('next').disabled=state.stage===7;document.getElementById('stage').innerHTML=content();bind();clock();}
function toggleFixes(){state.revealFixes=!state.revealFixes;save();render()}
function go(n){state.stage=Math.max(0,Math.min(7,n));save();render();window.scrollTo(0,0)}function move(d){go(state.stage+d)}
function clock(){let s=Math.max(0,state.seconds);document.getElementById('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');document.getElementById('timerBtn').textContent=ticking?'Ⅱ Пауза':'▶ Таймер'}
function toggleTimer(){if(ticking){clearInterval(ticking);ticking=null}else{ticking=setInterval(()=>{if(state.seconds>0){state.seconds--;save();clock()}else{clearInterval(ticking);ticking=null;alert('80 хвилин завершилися.')}} ,1000)}clock()}
function toggleTeacher(){if(!state.teacher){const code=prompt('Режим викладача. Введіть код із файлу ІНСТРУКЦІЯ.txt:');if(code!=='ZED-2026')return;}state.teacher=!state.teacher;save();render()}
function resetAll(){if(!confirm('Стерти всі відповіді й почати гру заново?'))return;state=initial();save();render()}
function setRole(n){state.role=n;save();render()}function setDoc(n){state.doc=n;save();render()}
function rolePane(){let r=state.roles[state.role];return `<div class="row between"><h3>${state.role+1}. ${roles[state.role][0]}</h3><span class="tag">Індивідуальна перевірка</span></div><div class="note">${roles[state.role][1]}</div><label>Ім'я студента</label><input data-path="roles.${state.role}.student" value="${esc(r.student)}" placeholder="Вкажіть ім'я"><label>Виявлені невідповідності</label>${input(`roles.${state.role}.findings`,r.findings,'Документ, графа, поточне значення, правильне значення...')}<label>Ризики для поставки</label>${input(`roles.${state.role}.risks`,r.risks,'Чим загрожує помилка?')}<label>Пропоновані дії</label>${input(`roles.${state.role}.actions`,r.actions,'Що виправити і хто відповідає?')}<label>Результат перевірки</label>${select(`roles.${state.role}.status`,r.status,[['pending','Ще не завершено'],['issues','Виявлено зауваження'],['ok','Зауважень немає']])}<div class="row between" style="margin-top:15px"><button class="secondary" onclick="setRole(Math.max(0,state.role-1))">← Попередня роль</button><button onclick="setRole(Math.min(5,state.role+1))">Наступна роль →</button></div>`}
function docs(){return `<div class="tabs no-print">${['Commercial Invoice','Packing List','CMR'].map((n,i)=>`<button onclick="setDoc(${i})" class="${state.doc===i?'active':''}">${n}</button>`).join('')}</div>${state.doc===1?packing():`<iframe class="docframe" title="Документ" src="${state.doc===0?invoicePdf:cmrPdf}"></iframe>`}<p class="muted" style="font-size:13px">Документи — навчальні макети. Порожні поля, призначені для перевізника, не вважайте помилками.</p>`}
function packing(){return `<div class="doc-preview"><div class="row between"><h2>PACKING LIST</h2><span>PL-2026-051</span></div><table><tr><th>Exporter</th><td>Vektor Mebel LLC<br>Dnipro, Ukraine</td><th>Importer</th><td>PolTrade Sp. z o.o.<br>Warsaw, Poland</td></tr><tr><th>Invoice No.</th><td>INV-2026-051</td><th>Date</th><td>12.11.2026</td></tr></table><h3>Packing details</h3><table><tr><th>Goods</th><th>Quantity</th><th>Packages</th><th>Net weight</th><th>Gross weight</th></tr><tr><td>Office chairs, metal frame</td><td>500 pcs</td><td>90 cartons</td><td>2 500 kg</td><td>2 400 kg</td></tr></table><p>Country of origin: Ukraine</p><p><a href="02_Packing_List.docx" download>Завантажити оригінальний шаблон Packing List (.docx)</a></p></div>`}
function conditions(){return `<table><tr><th>Параметр</th><th>Погоджені умови</th></tr>${[['Продавець','Vektor Mebel LLC, Dnipro, Ukraine'],['Покупець','PolTrade Sp. z o.o., Warsaw, Poland'],['Товар','Office chairs, metal frame'],['Кількість','500 шт.'],['Ціна одиниці','40 EUR'],['Загальна вартість','20 000 EUR'],['Пакування','100 коробок по 5 стільців'],['Маса нетто','2 500 кг'],['Маса брутто','2 800 кг'],['Incoterms','DAP Warsaw, Poland, Incoterms 2020'],['Місце завантаження','Dnipro, Ukraine'],['Місце доставки','Warsaw, Poland'],['Планова дата відправлення','12.11.2026']].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</table>`}
function content(){const title=`<div class="row between"><h2>${state.stage+1}. ${steps[state.stage][0]}</h2><span class="tag">${steps[state.stage][1]} хв</span></div>`;let s='';switch(state.stage){case 0:s=`<p>Ви — команда відділу ЗЕД підприємства <b>Vektor Mebel LLC</b>. До відправлення міжнародної партії офісних стільців залишилося небагато часу. Необхідно перевірити підготовлені документи та ухвалити рішення щодо відправлення.</p><div class="cards"><div class="card"><b>Одна поставка</b><p>Дніпро → Варшава</p></div><div class="card"><b>Три документи</b><p>Invoice · Packing List · CMR</p></div><div class="card"><b>Шість ролей</b><p>Кожен перевіряє свою ділянку</p></div></div><h3>Правила</h3><p>Спочатку кожен учасник перевіряє документи самостійно. Потім відбувається спільна нарада, внесення виправлень, кризова ситуація та остаточне рішення керівника. У документах можуть бути невідповідності, які необхідно виявити під час аудиту.</p><div class="note">Мета — не вгадати помилки, а обґрунтувати виправлення та узгодити дії всіх учасників.</div><p>Таймер угорі екрана можна запустити й зупинити. Він рахує загальний час пари.</p>`;break;
case 1:s=`<p>Ознайомтеся з вихідними умовами, потім перегляньте документи. На наступному етапі кожен отримає професійну роль.</p>${conditions()}<h3>Документи на перевірку</h3>${docs()}`;break;
case 2:s=`<p>Оберіть роль. Кожен студент перевіряє ті самі три документи, але зі своєї професійної позиції.</p><div class="tabs">${roles.map(([n],i)=>`<button onclick="setRole(${i})" class="${state.role===i?'active':''}">${i+1}. ${n}</button>`).join('')}</div>${rolePane()}<h3>Документи для звірки</h3>${docs()}`;break;
case 3:s=`<p><b>Керівник відділу ЗЕД</b> проводить нараду. Кожен учасник коротко називає знайдені невідповідності, їх наслідки й необхідні дії.</p><table><tr><th>Учасник</th><th>Висновок</th><th>Статус</th></tr>${state.roles.map((r,i)=>`<tr><td>${roles[i][0]}${r.student?' — '+esc(r.student):''}</td><td>${esc(r.findings||'Ще не внесено')}</td><td>${r.status==='issues'?'Зауваження':r.status==='ok'?'Без зауважень':'Не завершено'}</td></tr>`).join('')}</table><label>Спільний протокол наради</label>${input('meeting',state.meeting,'Які невідповідності підтверджені? Хто за що відповідає?',5)}<div class="teacher-only note"><b>Ключ викладача:</b> 22 000 → 20 000 EUR; 90 → 100 cartons; 2 400 → 2 800 kg; Krakow → Warsaw.</div>`;break;
case 4:s=`<p>Спочатку самостійно знайдіть невідповідності у трьох документах та обговоріть їх на нараді. Таблиця виправлень прихована, щоб не підказувати відповіді.</p><button class="secondary no-print" onclick="toggleFixes()">${state.revealFixes?"▲ Приховати таблицю виправлень":"▼ Показати таблицю виправлень"}</button>${state.revealFixes?`<p>Внесіть виправлення в контрольну таблицю. Для кожної невідповідності вкажіть правильне значення й відповідального. За потреби відредагуйте оригінальні документи в окремих файлах.</p><table><tr><th>Документ</th><th>Графа</th><th>Було</th><th>Правильно</th><th>Відповідальний</th></tr>${state.fixes.map((f,i)=>`<tr><td>${esc(f.doc)}</td><td>${esc(f.field)}</td><td>${esc(f.before)}</td><td><input data-path="fixes.${i}.after" value="${esc(f.after)}" placeholder="Введіть"></td><td><input data-path="fixes.${i}.owner" value="${esc(f.owner)}" placeholder="Хто виправляє?"></td></tr>`).join('')}</table><label>Інші уточнення та повторна звірка</label>${input('extra',state.extra,'Які документи ще потрібно перевірити після виправлень?')}<h3>Оригінальні шаблони</h3><p><a href="01_Commercial_Invoice_DHL.pdf" download>Commercial Invoice (PDF)</a> · <a href="02_Packing_List.docx" download>Packing List (Word)</a> · <a href="03_CMR.pdf" download>CMR (PDF)</a></p><div class="note">В електронній грі ви фіксуєте запропоновані виправлення. Це не змінює автоматично PDF і Word-файли.</div><div class="teacher-only note"><b>Правильні значення:</b> 20 000 EUR; 100 cartons; 2 800 kg; Warsaw, Poland.</div>`:``}`;break;
case 5:s=`<div class="note warn"><b>Термінове повідомлення зі складу!</b><p>Під час завантаження виявлено додаткову коробку з рекламними матеріалами для покупця. Працівник складу пропонує просто додати її до вантажу, не змінюючи документів, оскільки матеріали безкоштовні. Автомобіль уже прибув.</p></div><h3>Оберіть рішення команди</h3>${select('incident',state.incident,[['','Оберіть дію'],['send','Відправити без змін'],['remove','Не включати коробку до погодженої поставки'],['correct','Уточнити склад, погодити з покупцем і скоригувати документи']])}<label>Обґрунтуйте рішення</label>${input('decisionWhy',state.decisionWhy,'Чи потрібні зміни до документів? Які саме? Хто їх погоджує?',4)}<div class="teacher-only note"><b>Для викладача:</b> Безкоштовні матеріали також можуть потребувати документування і декларування. Можна залишити коробку на складі та відправити погоджену партію після виправлення основних документів; або погодити включення коробки, уточнити її характеристики, вартість для митних цілей і оновити необхідні документи.</div>`;break;
case 6:s=`<p>Керівник відділу ЗЕД заслуховує висновки та фіксує остаточне рішення.</p><div class="cards"><div class="card"><b>${state.roles.filter(x=>x.status!=='pending').length}/6</b><p>Ролей завершили перевірку</p></div><div class="card"><b>${state.fixes.filter(x=>x.after.trim()).length}/4</b><p>Виправлень запропоновано</p></div><div class="card"><b>${state.incident?'1':'0'}/1</b><p>Кризове рішення</p></div></div><label>Рішення про відправлення</label>${select('decision',state.decision,[['pending','Ще не ухвалено'],['go','Дозволити відправлення'],['conditional','Дозволити після виправлення та повторної перевірки'],['hold','Призупинити відправлення']])}<label>Підстави для рішення</label>${input('tasks',state.tasks,'Що зроблено, що ще треба виконати, хто відповідає та за яких умов можна відправити вантаж?',5)}<div class="note">Рішення «дозволити відправлення» має бути обґрунтоване підтвердженим усуненням критичних розбіжностей.</div>`;break;
case 7:s=`<p>Підбийте підсумки. Обговоріть, які помилки були критичними, як взаємодіяли ролі та що допомогло ухвалити рішення.</p><label>Загальний висновок студентів</label>${input('reflection',state.reflection,'Які уроки з документального контролю та управління ризиками?',4)}<h3>Завершення гри</h3><div class="row no-print"><button onclick="downloadReport()">↓ Завантажити звіт (.html)</button><button class="secondary" onclick="window.print()">Друк / зберегти PDF</button></div><div class="teacher-only note"><b>Підсумкова позиція:</b> відправлення дозволяється лише після усунення та перевірки розбіжностей. Додаткову коробку не можна перевозити без належного погодження та документування.</div>`;break;}
return title+s;}
function downloadReport(){const lines=[];lines.push('<!doctype html><html lang="uk"><meta charset="utf-8"><title>Звіт аудиту ЗЕД</title><style>body{font-family:Arial;max-width:900px;margin:35px auto;line-height:1.55}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:8px;text-align:left}th{background:#eee}h2{margin-top:30px}</style><h1>Звіт аудиту — Vektor Mebel LLC</h1><p>Навчальна поставка: Дніпро → Варшава · 500 офісних стільців</p>');lines.push('<h2>Перевірка за ролями</h2>');state.roles.forEach((r,i)=>lines.push(`<h3>${esc(roles[i][0])} — ${esc(r.student)}</h3><p><b>Помилки:</b> ${esc(r.findings)}</p><p><b>Ризики:</b> ${esc(r.risks)}</p><p><b>Дії:</b> ${esc(r.actions)}</p>`));lines.push(`<h2>Нарада</h2><p>${esc(state.meeting)}</p><h2>Виправлення</h2><table><tr><th>Документ</th><th>Поле</th><th>Було</th><th>Виправити на</th><th>Відповідальний</th></tr>`);state.fixes.forEach(f=>lines.push(`<tr><td>${esc(f.doc)}</td><td>${esc(f.field)}</td><td>${esc(f.before)}</td><td>${esc(f.after)}</td><td>${esc(f.owner)}</td></tr>`));lines.push(`</table><p>${esc(state.extra)}</p><h2>Кризова ситуація</h2><p>Рішення: ${esc(state.incident)}</p><p>${esc(state.decisionWhy)}</p><h2>Остаточне рішення</h2><p>${esc(state.decision)}</p><p>${esc(state.tasks)}</p><h2>Підсумки</h2><p>${esc(state.reflection)}</p></html>`);const blob=new Blob([lines.join('')],{type:'text/html;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ZED_audit_report.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
render();
</script></body></html>
